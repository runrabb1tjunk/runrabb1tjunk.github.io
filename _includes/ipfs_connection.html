<div class="gateway-card">
    <h1>Web3 Access Verification</h1>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.33.2/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@4.0.0/dist/cytoscape-dagre.min.js"></script>

<script>
const WORKER_URL = "https://late-violet-5384.fgfg57468.workers.dev";
const POLYGON_CHAIN_ID = "0x89";
const SIGN_MESSAGE = "Sign this message to verify ownership of this wallet for Web3 Gate.";

let currentGatewayData = {
    tier0: [],
    tier1333: [],
    tier4444: []
};

function initGateway() {
    checkInstalledWallets();
    const savedAddress = localStorage.getItem('web3_user_address');
    const savedSignature = localStorage.getItem('web3_user_signature');
    const savedWalletType = localStorage.getItem('web3_wallet_type');
    
    if (savedAddress && savedSignature && savedWalletType) {
        verifyAndSendBalance(false, savedAddress, savedSignature, savedWalletType);
    } else {
        fetchGatewayData(null, null, null);
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGateway);
} else {
    initGateway();
}

function checkInstalledWallets() {
    const isAnyEth = typeof window.ethereum !== 'undefined';
    const hasMetaMask = isAnyEth && (window.ethereum.isMetaMask || window.ethereum.providers?.some(p => p.isMetaMask));
    const hasPhantom = typeof window.phantom?.ethereum !== 'undefined';
    let hasTrust = false;
    if (isAnyEth) {
        if (window.ethereum.isTrust) hasTrust = true;
        else if (window.ethereum.providers?.length) {
            hasTrust = window.ethereum.providers.some(p => p.isTrust);
        }
    }
    if (!hasMetaMask && !isAnyEth) {
        const mmBtn = document.getElementById('connect-metamask');
        if(mmBtn) { mmBtn.disabled = true; mmBtn.innerText = "MetaMask (Not Installed)"; }
    }
    if (!hasTrust) {
        const twBtn = document.getElementById('connect-trust');
        if(twBtn) { twBtn.disabled = true; twBtn.innerText = "Trust Wallet (Not Installed)"; }
    }
    if (!hasPhantom) {
        const phBtn = document.getElementById('connect-phantom');
        if(phBtn) { phBtn.disabled = true; phBtn.innerText = "Phantom (Not Installed)"; }
    }
}

function getProvider(walletType) {
    if (walletType === 'phantom') return window.phantom?.ethereum || null;
    if (typeof window.ethereum === 'undefined') return null;
    if (window.ethereum.providers && window.ethereum.providers.length) {
        if (walletType === 'metamask') {
            return window.ethereum.providers.find(p => p.isMetaMask && !p.isTrust) || window.ethereum.providers[0];
        }
    }
    if (walletType === 'trust') {
        return window.ethereum.providers.find(p => p.isTrust) || window.ethereum.providers[0];
    }
    if (walletType === 'trust' && window.ethereum.isTrust) return window.ethereum;
    return window.ethereum;
}

function isRussianText(text) {
    if (!text) return false;
    return /[а-яё]/i.test(text);
}

function populateTierContainer(container, items) {
    if (!Array.isArray(items) || items.length === 0) return;
    const enItems = [];
    const ruItems = [];

    items.forEach(item => {
        const name = item.name || item.title || "";
        if (isRussianText(name)) {
            ruItems.push(item);
        } else {
            enItems.push(item);
        }
    });

    function createItemElement(item) {
        if (item.url) {
            const a = document.createElement('a');
            a.href = item.url;
            a.target = "_blank";
            a.className = "open-btn";
            a.innerText = item.name || item.title || "Link";
            return a;
        } else {
            const div = document.createElement('div');
            div.className = "locked-item";
            div.innerText = item.name || item.title || "Locked Content";
            return div;
        }
    }

    enItems.forEach(item => {
        container.appendChild(createItemElement(item));
    });

    if (enItems.length > 0 && ruItems.length > 0) {
        const divider = document.createElement('div');
        divider.className = "lang-divider";
        container.appendChild(divider);
    }

    ruItems.forEach(item => {
        container.appendChild(createItemElement(item));
    });
}

function renderUI(data) {
    const list0 = document.getElementById('links-list-0');
    const list1333 = document.getElementById('links-list-1333');
    const list4444 = document.getElementById('links-list-4444');
    const title1333 = document.getElementById('title-1333');
    const title4444 = document.getElementById('title-4444');
    
    if(!list0 || !list1333 || !list4444) return;
    list0.innerHTML = ""; list1333.innerHTML = ""; list4444.innerHTML = "";
    
    const fallbackData = data || {};
    currentGatewayData.tier0 = fallbackData.tier0 || fallbackData.tier_0 || fallbackData.free || [];
    currentGatewayData.tier1333 = fallbackData.tier1333 || fallbackData.tier_1333 || [];
    currentGatewayData.tier4444 = fallbackData.tier4444 || fallbackData.tier_4444 || [];

    if (title1333) {
        const hasAccess = currentGatewayData.tier1333.some(i => i.url != null && i.url !== undefined);
        title1333.innerText = hasAccess ? "Access Granted for Tier 1333+" : "Tier 1333+ (Locked)";
    }
    if (title4444) {
        const hasAccess = currentGatewayData.tier4444.some(i => i.url != null && i.url !== undefined);
        title4444.innerText = hasAccess ? "Access Granted for Tier 4444+" : "Tier 4444+ (Locked)";
    }

    populateTierContainer(list0, currentGatewayData.tier0);
    populateTierContainer(list1333, currentGatewayData.tier1333);
    populateTierContainer(list4444, currentGatewayData.tier4444);

    buildGraph();
}

async function fetchGatewayData(userAddress, signature, message) {
    const errorBox = document.getElementById('error-box');
    if (errorBox) errorBox.style.display = 'none';
    try {
        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ address: userAddress, signature: signature, message: message })
        });
        if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error || "Worker responded with error status");
        }
        const data = await response.json();
        renderUI(data);
    } catch(e) {
        console.error("Network or parse issue:", e);
        const errorOutput = document.getElementById('error-output');
        if (errorBox && errorOutput) {
            errorOutput.innerText = e.message || "Could not sync data with server.";
            errorBox.style.display = 'block';
        }
        renderUI(null);
    }
}

async function verifyAndSendBalance(isManualClick, savedAddress = null, savedSignature = null, walletType = 'metamask') {
    const authButtonsGroup = document.getElementById('auth-buttons-group');
    const logoutBtn = document.getElementById('logout-btn');
    const desc = document.getElementById('gateway-desc');
    const errorBox = document.getElementById('error-box');
    const errorOutput = document.getElementById('error-output');
    const loader = document.getElementById('loading-loader');
    const loaderText = document.getElementById('loading-text-status');
    if(errorBox) errorBox.style.display = 'none';
    const activeProvider = getProvider(walletType);
    if (!activeProvider) {
        if(errorOutput && errorBox) {
            errorOutput.innerText = `Selected wallet (${walletType}) is not available!`;
            errorBox.style.display = 'block';
        }
        return;
    }
    try {
        if(authButtonsGroup) authButtonsGroup.style.display = 'none';
        if(desc) desc.style.display = 'none';
        if(loader) loader.style.display = 'flex';
        if(loaderText) loaderText.innerText = isManualClick ? "Connecting wallet..." : "Auto-login...";
        let userAddress = savedAddress;
        let signature = savedSignature;
        if (!userAddress) {
            const accounts = await activeProvider.request({ method: 'eth_requestAccounts' });
            userAddress = accounts[0];
        }
        if(loaderText) loaderText.innerText = "Checking network...";
        try {
            await activeProvider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: POLYGON_CHAIN_ID }] });
        } catch(switchError) {
            if (switchError.code === 4902) {
                await activeProvider.request({
                    method: 'wallet_addEthereumChain',
                    params: [{
                        chainId: POLYGON_CHAIN_ID,
                        chainName: 'Polygon Mainnet',
                        nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18},
                        rpcUrls: ['https://polygon.llamarpc.com', 'https://polygon.meowrpc.com'],
                        blockExplorerUrls: ['https://polygonscan.com']
                    }]
                });
            } else {
                throw new Error("Please switch your network to Polygon Mainnet inside your wallet.");
            }
        }
        if (!signature) {
            if(loaderText) loaderText.innerText = "Sign message in wallet...";
            const from = userAddress;
            const msg = `0x${Array.from(new TextEncoder().encode(SIGN_MESSAGE)).map(b => b.toString(16).padStart(2, '0')).join("")}`;
            signature = await activeProvider.request({
                method: 'personal_sign',
                params: [msg, from],
            });
        }
        localStorage.setItem('web3_user_address', userAddress);
        localStorage.setItem('web3_user_signature', signature);
        localStorage.setItem('web3_wallet_type', walletType);
        if(loaderText) loaderText.innerText = "Synchronizing gateway...";
        await fetchGatewayData(userAddress, signature, SIGN_MESSAGE);
        if(loader) loader.style.display = 'none';
        if(logoutBtn) logoutBtn.style.display = 'block';
    } catch(err) {
        console.error(err);
        if(loader) loader.style.display = 'none';
        logout();
        if(errorOutput && errorBox && err.message) {
            errorOutput.innerText = err.message;
            errorBox.style.display = 'block';
            fetchGatewayData(null, null, null);
        }
    }
}

function logout() {
    localStorage.removeItem('web3_user_address');
    localStorage.removeItem('web3_user_signature');
    localStorage.removeItem('web3_wallet_type');
    const authButtonsGroup = document.getElementById('auth-buttons-group');
    const desc = document.getElementById('gateway-desc');
    const logoutBtn = document.getElementById('logout-btn');
    const errorBox = document.getElementById('error-box');
    if(logoutBtn) logoutBtn.style.display = 'none';
    if(errorBox) errorBox.style.display = 'none';
    if(authButtonsGroup) authButtonsGroup.style.display = 'flex';
    if(desc) desc.style.display = 'block';
    fetchGatewayData(null, null, null);
}

/* ================= Инициализация и рендеринг последовательного графа «Сфера» ================= */

function closeNodeMenu() {
    const menu = document.getElementById('node-menu');
    if (menu) menu.style.display = 'none';
}

function buildGraph() {
    closeNodeMenu();
    const elements = [];

    // Собираем все файлы со всех уровней доступа
    const allFiles = [
        ...currentGatewayData.tier0.map(f => ({...f, tier: 'Tier 0'})),
        ...currentGatewayData.tier1333.map(f => ({...f, tier: 'Tier 1333'})),
        ...currentGatewayData.tier4444.map(f => ({...f, tier: 'Tier 4444'}))
    ];

    // Структурируем данные под новые узлы графа
    const graphNodesData = {
        'shore_1': { label: 'Shore 1: Walk', en: null, ru: null, tier: 'Tier 0', imgIndex: "shore_1.jpg" },
        'sphere_arrival': { label: 'Sphere: Arrival', en: null, ru: null, tier: 'Tier 0', imgIndex: "arrival.png" },
        'sphere_1': { label: 'Sphere 1: Without sun', en: null, ru: null, tier: 'Tier 1333', imgIndex: "withoutsun_1.jpg" },
        'sphere_2': { label: 'Sphere 2: Without sun', en: null, ru: null, tier: 'Tier 1333', imgIndex: "withoutsun2.jpg" },
        'sphere_3': { label: 'Sphere 3: Without sun', en: null, ru: null, tier: 'Tier 4444', imgIndex: "withoutsun3.jpg" },
        'sphere_4': { label: 'Sphere 4: Without sun', en: null, ru: null, tier: 'Tier 4444', imgIndex: "withoutsun4.JPG" },
        'shore_2': { label: 'Shore 2: Breach', en: null, ru: null, tier: 'Tier 0', imgIndex: "shore_2.jpg" }
    };

    // Распределяем файлы из воркера по соответствующим узлам
    allFiles.forEach(file => {
        const name = file.name;
        
        // Shore 1 / Берег 1
        if (/Shore First\. Walk/i.test(name)) { graphNodesData['shore_1'].en = file; }
        else if (/Берег Первый\. Прогулка/i.test(name)) { graphNodesData['shore_1'].ru = file; }
        
        // Sphere Arrival / Прибытие
        else if (/Sphere\. Arrival/i.test(name)) { graphNodesData['sphere_arrival'].en = file; }
        else if (/Сфера\. Прибытие/i.test(name)) { graphNodesData['sphere_arrival'].ru = file; }
        
        // Шаги Сферы
        else if (/Sphere 1/i.test(name)) { graphNodesData['sphere_1'].en = file; }
        else if (/Сфера 1/i.test(name)) { graphNodesData['sphere_1'].ru = file; }
        
        else if (/Sphere 2/i.test(name)) { graphNodesData['sphere_2'].en = file; }
        else if (/Сфера 2/i.test(name)) { graphNodesData['sphere_2'].ru = file; }
        
        else if (/Sphere 3/i.test(name)) { graphNodesData['sphere_3'].en = file; }
        else if (/Сфера 3/i.test(name)) { graphNodesData['sphere_3'].ru = file; }
        
        else if (/Sphere 4/i.test(name)) { graphNodesData['sphere_4'].en = file; }
        else if (/Сфера 4/i.test(name)) { graphNodesData['sphere_4'].ru = file; }
        
        // Shore 2 / Берег 2
        else if (/Shore Second\. Breach/i.test(name)) { graphNodesData['shore_2'].en = file; }
        else if (/Берег Второй\. Прорыв/i.test(name)) { graphNodesData['shore_2'].ru = file; }
    });

    // Генерируем элементы для Cytoscape
    Object.keys(graphNodesData).forEach(id => {
        const nodeInfo = graphNodesData[id];
        const hasEn = !!nodeInfo.en;
        const hasRu = !!nodeInfo.ru;
        
        // Если файлы заблокированы на сервере (url равен null или отсутствует)
        const isLocked = (hasEn && !nodeInfo.en.url) || (hasRu && !nodeInfo.ru.url) || (!hasEn && !hasRu);

        // Формируем список доступных языковых ссылок
        const nodeLinks = [];
        if (hasEn && nodeInfo.en.url) nodeLinks.push({ label: 'English Ver.', url: nodeInfo.en.url });
        if (hasRu && nodeInfo.ru.url) nodeLinks.push({ label: 'Русская версия', url: nodeInfo.ru.url });

        elements.push({
            data: {
                id: id,
                label: `[${nodeInfo.tier}] ${nodeInfo.label}`,
                isLocked: isLocked,
                links: nodeLinks,
                img: `https://black-obliged-cricket-162.mypinata.cloud/ipfs/bafybeicxups533madtff5yhhcya2ogmhtpfwxd4ve3kmqgf62464iljani/${nodeInfo.imgIndex}`
            }
        });
    });

    // Описываем связи согласно схеме:
    // 1. Берег первый -> Сфера 1
    // 2. Сфера прибытие -> Сфера 1
    // 3. Сфера 1 -> Сфера 2 -> Сфера 3 -> Сфера 4
    // 4. Сфера 4 -> Берег второй
    const edges = [
        { source: 'shore_1', target: 'sphere_1' },
        { source: 'sphere_arrival', target: 'sphere_1' },
        { source: 'sphere_1', target: 'sphere_2' },
        { source: 'sphere_2', target: 'sphere_3' },
        { source: 'sphere_3', target: 'sphere_4' },
        { source: 'sphere_4', target: 'shore_2' }
    ];

    edges.forEach((edge, index) => {
        elements.push({
            data: {
                id: `edge_${index}`,
                source: edge.source,
                target: edge.target
            }
        });
    });

    const cy = cytoscape({
        container: document.getElementById('cy'),
        zoomingEnabled: true,
        userZoomingEnabled: true,
        elements: elements,
        style: [
            {
                selector: 'node',
                style: {
                    'width': '85px',
                    'height': '85px',
                    'shape': 'round-rectangle',
                    'background-image': 'data(img)',
                    'background-fit': 'cover',
                    'border-width': '3px',
                    'border-color': function(ele){ return ele.data('isLocked') ? '#ff4d4d' : '#34d399'; },
                    'border-style': function(ele){ return ele.data('isLocked') ? 'dashed' : 'solid'; },
                    'label': 'data(label)',
                    'font-family': '"Amatic SC", Amatic SC, sans-serif',
                    'font-size': '15px',
                    'font-weight': 'bold',
                    'text-valign': 'bottom',
                    'text-margin-y': '8px',
                    'color': '#ffffff',
                    'text-background-opacity': 0.85,
                    'text-background-color': '#0d1b2a',
                    'text-background-padding': '4px',
                    'text-background-shape': 'roundrectangle'
                }
            },
            {
                selector: 'edge',
                style: {
                    'width': 3,
                    'line-color': '#007cba',
                    'curve-style': 'bezier',
                    'target-arrow-shape': 'triangle',
                    'target-arrow-color': '#007cba'
                }
            }
        ],
        layout: {
            name: 'dagre',
            rankDir: 'LR',
            nodeSep: 45,
            rankSep: 90,
            animate: false
        }
    });

    // Изменение 1: Увеличение масштаба в 3 раза и автоматическая центровка на самых левых блоках
    cy.ready(function() {
        cy.fit(); // Сначала вписываем в экран для базового расчета
        const currentZoom = cy.zoom(); 
        cy.zoom(currentZoom * 3); // Умножаем на 3

        const nodes = cy.nodes();
        if (nodes.length > 0) {
            // Ищем минимальную координату X
            let minX = Infinity;
            nodes.forEach(node => {
                const posX = node.position('x');
                if (posX < minX) {
                    minX = posX;
                }
            });
            // Фильтруем узлы, находящиеся на крайней левой вертикали
            const leftmostNodes = nodes.filter(node => Math.abs(node.position('x') - minX) < 10);
            
            // Центрируем камеру строго по этим левым узлам
            cy.center(leftmostNodes);
        }
    });

    // Логика клика на узел
    cy.on('tap', 'node', function(evt) {
        const node = evt.target;
        const isLocked = node.data('isLocked');
        const links = node.data('links') || [];

        if (isLocked) {
            alert("This step is locked! Connect a Web3 wallet with the correct token balance.");
            closeNodeMenu();
            return;
        }

        if (links.length === 0) {
            alert("No available links found.");
            return;
        }

        // Если ссылка одна — открываем сразу
        if (links.length === 1) {
            window.open(links[0].url, '_blank');
            return;
        }

        // Рендерим меню выбора языка
        const container = document.getElementById('node-links-container');
        container.innerHTML = '';
        
        links.forEach(link => {
            const a = document.createElement('a');
            a.href = link.url;
            a.target = '_blank';
            a.innerText = link.label;
            a.onclick = () => setTimeout(closeNodeMenu, 100);
            container.appendChild(a);
        });

        // Изменение 2: Вывод языкового меню ровно по центру вьюпорта Cytoscape
        const menu = document.getElementById('node-menu');
        menu.style.display = 'flex';
        menu.style.left = '50%';
        menu.style.top = '50%';
        menu.style.transform = 'translate(-50%, -50%)';
    });

    cy.on('mouseover', 'node', function() {
        document.getElementById('cy').style.cursor = 'pointer';
    });
    cy.on('mouseout', 'node', function() {
        document.getElementById('cy').style.cursor = 'default';
    });
}
</script>
